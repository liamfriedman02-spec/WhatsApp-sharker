# One-click deploy on Render: New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for in the Render dashboard (secrets never live in git).
# Leave a channel's values empty if you don't use it (WhatsApp, Telegram or both).
services:
  - type: web
    name: sharker-boss-coach
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # "development" = demo Bosses until the Sharker API is connected (production requires it).
      - key: NODE_ENV
        value: development
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Random value; copy it into Meta → WhatsApp → Configuration → Verify token.
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # Telegram bot token from @BotFather (optional; leave empty for WhatsApp only).
      # The webhook is registered automatically on Render's public URL.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Your WhatsApp number (international format, digits only) → chats as a demo Boss.
      - key: DEMO_BOSS_PHONE
        sync: false
      - key: DEMO_BOSS_ID
        value: boss_carla
      # Optional: enables the Claude coach and post writer.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: ./data/sharker-bot.db
